name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (example: 1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${env:GITHUB_REF_TYPE}" -eq "tag" -and "${env:GITHUB_REF_NAME}" -ne "") {
            $releaseVersion = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          } else {
            $releaseVersion = "${{ github.event.inputs.version }}"
          }

          if ([string]::IsNullOrWhiteSpace($releaseVersion)) {
            Write-Error "Release version is empty."
            exit 1
          }

          "value=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Ensure tools
        shell: pwsh
        run: |
          choco install ninja innosetup -y --no-progress

      - name: Configure
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          cl
          cmake --version
          ninja --version
          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE:STRING=Release" `
            "-DCHESS_RELEASE_VERSION:STRING=$version" `
            "-DCHESS_RELEASE_ARCH:STRING=x64" `
            "-DCHESS_WINDOWS_PORTABLE_RUNTIME:BOOL=ON" `
            "-DCHESS_WINDOWS_FORCE_STATIC_GNU_RUNTIME:BOOL=OFF"

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build windows release artifacts
        shell: pwsh
        run: cmake --build build --target chess_onefile

      - name: Test installer and settings across reinstall
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          ./tools/test_windows_installer.ps1 `
            -Installer "build/release/chess-windows-x64-v$version.exe" `
            -StorageTests "build/chess_storage_tests.exe" `
            -TestRoot "$env:RUNNER_TEMP/chess-installer-tests"

      - name: Verify packaged checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $exePath = "build/release/chess-windows-x64-v$version.exe"
          $shaPath = "$exePath.sha256"
          if (-not (Test-Path -LiteralPath $exePath) -or -not (Test-Path -LiteralPath $shaPath)) {
            throw "Missing installer or checksum: $exePath"
          }
          $expected = ((Get-Content -LiteralPath $shaPath | Select-Object -First 1) -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Installer SHA256 mismatch." }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-windows-release-${{ steps.version.outputs.value }}
          path: |
            build/release/chess-windows-x64-v${{ steps.version.outputs.value }}.exe
            build/release/chess-windows-x64-v${{ steps.version.outputs.value }}.exe.sha256
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: |
            build/release/chess-windows-x64-v${{ steps.version.outputs.value }}.exe
            build/release/chess-windows-x64-v${{ steps.version.outputs.value }}.exe.sha256
