name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-storage:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure without graphics dependencies
        run: cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHESS_BUILD_APP=OFF
      - name: Build
        run: cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure
